<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10151a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Goosepocalypse"><link rel="manifest" href="manifest.webmanifest"><title>Phoenix & Mummy: Goosepocalypse</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#10151a;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;inset:calc(env(safe-area-inset-top) + 12px) 14px auto 14px;display:flex;justify-content:space-between;z-index:3;text-shadow:0 2px 5px #000;font-weight:800;pointer-events:none}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;font-size:28px;pointer-events:none}#move{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:130px;height:130px;border:2px solid #ffffff55;border-radius:50%;z-index:4;touch-action:none}#stick{position:absolute;width:54px;height:54px;border-radius:50%;background:#ffffff55;left:38px;top:38px}#fire{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 30px);width:92px;height:92px;border-radius:50%;border:3px solid #ffffff88;background:#a51f2bcc;color:white;font-size:18px;font-weight:900;z-index:4}#menu{position:fixed;inset:0;z-index:10;background:linear-gradient(#0b1015,#151a1f);display:flex;align-items:center;justify-content:center;padding:24px}.card{max-width:430px;width:100%;text-align:center}h1{font-size:32px;line-height:1;margin:18px 0 8px}.goose{font-size:80px}.sub{opacity:.72;margin-bottom:20px}.picks{display:flex;gap:10px}.pick,.start{flex:1;min-height:52px;border:1px solid #ffffff44;border-radius:15px;background:#ffffff12;color:#fff;font-weight:800;font-size:16px}.pick.on{background:#ffffff2b;border-color:white}.start{width:100%;margin-top:12px;background:white;color:#111}#damage{position:fixed;inset:0;background:#b4000028;opacity:0;pointer-events:none;z-index:2}</style></head><body><canvas id="game"></canvas><div id="damage"></div><div id="cross">＋</div><div id="hud"><span id="health">❤ 100</span><span id="score">SCORE 0</span></div><div id="move"><div id="stick"></div></div><button id="fire">FIRE</button><div id="menu"><div class="card"><div class="goose">🪿🦷</div><h1>GOOSEPOCALYPSE</h1><div class="sub">The geese have teeth. This was a mistake.</div><div class="picks"><button class="pick on" data-hero="Phoenix">🟣 Phoenix</button><button class="pick" data-hero="Mummy">🟡 Mummy</button></div><button class="start">ENTER THE FOREST</button></div></div><script type="module" src="game.js"></script></body></html>
