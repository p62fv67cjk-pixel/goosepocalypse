name: Safari window terminal pointer regression
on:
  push:
    branches: [main, fix/window-terminal-pointer-ownership]
  pull_request:
    paths:
      - 'controls-fixes.js'
      - 'tests/window-terminal-pointer.test.cjs'
      - '.github/workflows/window-terminal-pointer.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/window-terminal-pointer.test.cjs
