name: Sprint touch ownership regression
on:
  push:
    branches: ['fix/sprint-nonowner-release-guard']
  pull_request:
  workflow_dispatch:
jobs:
  sprint-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/sprint-nonowner-release.test.cjs
