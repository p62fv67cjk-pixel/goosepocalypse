name: Empty trigger cooldown regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  empty-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/empty-trigger-cooldown.test.mjs
