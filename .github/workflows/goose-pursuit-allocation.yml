name: Goose pursuit allocation regression
on:
  push:
    paths:
      - 'game.js'
      - 'tests/goose-pursuit-allocation.test.mjs'
      - '.github/workflows/goose-pursuit-allocation.yml'
  pull_request:
    paths:
      - 'game.js'
      - 'tests/goose-pursuit-allocation.test.mjs'
      - '.github/workflows/goose-pursuit-allocation.yml'
jobs:
  chase-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/goose-pursuit-allocation.test.mjs
