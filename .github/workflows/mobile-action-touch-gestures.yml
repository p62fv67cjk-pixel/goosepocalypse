name: Mobile action touch gesture regression
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  touch-gestures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify action and joystick touch gesture CSS
        run: node --test tests/mobile-action-touch-gestures.test.mjs
