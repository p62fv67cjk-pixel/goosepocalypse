name: Landing ground transition regression
on:
  pull_request:
  push:
    branches: [main, fix/landing-ground-transition-guard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/landing-ground-transition.test.cjs
