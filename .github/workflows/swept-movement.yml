name: Swept player collision regression
on:
  push:
    paths:
      - 'movement-collision.js'
      - 'game.js'
      - 'tests/movement-collision.test.mjs'
      - '.github/workflows/swept-movement.yml'
  pull_request:
    paths:
      - 'movement-collision.js'
      - 'game.js'
      - 'tests/movement-collision.test.mjs'
      - '.github/workflows/swept-movement.yml'
jobs:
  swept-movement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game.js
      - run: node --experimental-default-type=module tests/movement-collision.test.mjs
