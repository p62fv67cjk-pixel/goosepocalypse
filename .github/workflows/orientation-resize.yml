name: Safari orientation resize
on:
  push:
    branches: [main, 'fix/zero-size-orientation-resize']
  pull_request:
    paths:
      - game.js
      - tests/orientation-resize.test.cjs
      - .github/workflows/orientation-resize.yml
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/orientation-resize.test.cjs
