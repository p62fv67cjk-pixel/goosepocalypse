name: Immediate jump ground state
on:
  push:
    branches: [main, 'fix/immediate-airborne-audio-state']
  pull_request:
    paths:
      - game.js
      - tests/immediate-jump-ground-state.test.cjs
      - .github/workflows/immediate-jump-ground-state.yml
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/immediate-jump-ground-state.test.cjs
