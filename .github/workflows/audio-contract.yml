name: Recorded audio contract
on:
  push:
    branches: [main, 'test/audio-contract-*']
  pull_request:
jobs:
  audio-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/audio-contract.test.mjs
