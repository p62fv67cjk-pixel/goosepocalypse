name: Forest regression
on:
  pull_request:
    paths:
      - 'game.js'
      - 'tests/forest-regression.cjs'
      - '.github/workflows/forest-regression.yml'
  push:
    branches:
      - feature/moonlit-forest-realism
    paths:
      - 'game.js'
      - 'tests/forest-regression.cjs'
      - '.github/workflows/forest-regression.yml'
jobs:
  forest-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game.js
      - run: node tests/forest-regression.cjs
